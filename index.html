<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אלטל תעשיות — מדרגות, מעקות ועבודות מתכת</title>
<meta name="description" content="אלטל תעשיות — תכנון וייצור מדרגות, מעקות ועבודות מתכת בהתאמה אישית.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2a4a;--accent:#2e6dd9;--bg:#f4f6f9;--muted:#5b6b85;--line:#dfe4ec}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--navy);font-family:Heebo,system-ui,Arial,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.card{width:100%;max-width:560px;text-align:center}
.mark{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:18px;
  background:var(--navy);color:#fff;font-weight:800;font-size:38px;margin-bottom:22px}
h1{margin:0;font-size:clamp(34px,7vw,52px);font-weight:800;letter-spacing:-.5px}
.en{margin:4px 0 0;font-size:15px;letter-spacing:.35em;color:var(--muted);font-weight:400}
.what{margin:26px 0 0;font-size:clamp(18px,3.6vw,22px);font-weight:300;line-height:1.6}
.soon{display:inline-block;margin-top:18px;padding:5px 14px;border:1px solid var(--line);border-radius:999px;
  font-size:14px;color:var(--muted);background:#fff}
.contact{margin-top:36px;display:flex;flex-direction:column;gap:12px}
.contact a{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 18px;border-radius:12px;
  text-decoration:none;font-size:18px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--navy)}
.contact a.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.contact a:hover{filter:brightness(.97)}
.contact a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.contact span[dir=ltr]{unicode-bidi:isolate}
.work{margin-top:40px}
.work img{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 2px 14px rgba(27,42,74,.12)}
footer{text-align:center;padding:18px 16px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="mark" aria-hidden="true">א</div>
    <h1>אלטל תעשיות</h1>
    <p class="en">ELTAL INDUSTRIES</p>
    <p class="what">תכנון וייצור מדרגות, מעקות<br>ועבודות מתכת בהתאמה אישית</p>
    <span class="soon">האתר המלא בבנייה</span>
    <div class="contact">
      <a class="primary" href="tel:+972549984099">טל · <span dir="ltr">054-998-4099</span></a>
      <a href="https://wa.me/972549984099">וואטסאפ</a>
      <a href="mailto:tal@eltal.co.il"><span dir="ltr">tal@eltal.co.il</span></a>
    </div>
    <figure class="work" style="margin-inline:0">
      <img src="flyer.jpg" width="993" height="1431" loading="lazy"
           alt="עבודות של אלטל: מדרגות פלדה, מעקות וגלריות שייצרנו — ייצור מדרגות וגלריות, טל ויזל 054-9984099">
    </figure>
  </div>
</main>
<footer>© אלטל תעשיות</footer>
</body>
</html>
